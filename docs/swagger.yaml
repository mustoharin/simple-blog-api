basePath: /api/v1
definitions:
  domain.ActiveUserItem:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      last_login_at:
        type: string
    type: object
  domain.ActiveUsers:
    properties:
      count:
        type: integer
      users:
        items:
          $ref: '#/definitions/domain.ActiveUserItem'
        type: array
    type: object
  domain.AuditLog:
    properties:
      action:
        type: string
      actor_email:
        type: string
      actor_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      ip_address:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
      user_agent:
        type: string
    type: object
  domain.Comment:
    properties:
      author:
        $ref: '#/definitions/domain.User'
      author_id:
        type: string
      body:
        type: string
      created_at:
        type: string
      id:
        type: string
      post_id:
        type: string
      status:
        $ref: '#/definitions/domain.CommentStatus'
    type: object
  domain.CommentStatus:
    enum:
    - pending
    - approved
    - rejected
    type: string
    x-enum-varnames:
    - CommentStatusPending
    - CommentStatusApproved
    - CommentStatusRejected
  domain.DashboardOverview:
    properties:
      total_comments:
        type: integer
      total_images:
        type: integer
      total_posts:
        type: integer
      total_users:
        type: integer
    type: object
  domain.DashboardResponse:
    properties:
      active_users:
        $ref: '#/definitions/domain.ActiveUsers'
      overview:
        $ref: '#/definitions/domain.DashboardOverview'
      post_analytics:
        $ref: '#/definitions/domain.PostAnalytics'
      recent_activity:
        items:
          $ref: '#/definitions/domain.RecentActivityItem'
        type: array
    type: object
  domain.Image:
    properties:
      created_at:
        type: string
      filename:
        type: string
      id:
        type: string
      s3_key:
        type: string
      uploaded_by:
        type: string
      url:
        type: string
    type: object
  domain.Permission:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  domain.Post:
    properties:
      author_id:
        type: string
      comment_count:
        type: integer
      content:
        type: string
      cover_image_url:
        type: string
      created_at:
        type: string
      excerpt:
        type: string
      id:
        type: string
      published_at:
        type: string
      slug:
        type: string
      status:
        $ref: '#/definitions/domain.PostStatus'
      tags:
        items:
          $ref: '#/definitions/domain.Tag'
        type: array
      title:
        type: string
      updated_at:
        type: string
      view_count:
        type: integer
    type: object
  domain.PostAnalyticItem:
    properties:
      comment_count:
        type: integer
      id:
        type: string
      published_at:
        type: string
      slug:
        type: string
      title:
        type: string
      view_count:
        type: integer
    type: object
  domain.PostAnalytics:
    properties:
      range_days:
        type: integer
      top_by_comments:
        items:
          $ref: '#/definitions/domain.PostAnalyticItem'
        type: array
      top_by_views:
        items:
          $ref: '#/definitions/domain.PostAnalyticItem'
        type: array
    type: object
  domain.PostStatus:
    enum:
    - draft
    - published
    type: string
    x-enum-varnames:
    - PostStatusDraft
    - PostStatusPublished
  domain.RecentActivityItem:
    properties:
      action:
        type: string
      actor_email:
        type: string
      created_at:
        type: string
      id:
        type: string
    type: object
  domain.Role:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/domain.Permission'
        type: array
    type: object
  domain.Tag:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  domain.User:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      last_login_at:
        type: string
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          $ref: '#/definitions/domain.Role'
        type: array
      status:
        $ref: '#/definitions/domain.UserStatus'
      updated_at:
        type: string
    type: object
  domain.UserStatus:
    enum:
    - pending_invitation
    - active
    - expired_invitation
    type: string
    x-enum-varnames:
    - UserStatusPendingInvitation
    - UserStatusActive
    - UserStatusExpiredInvitation
  handler.acceptInvitationRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  handler.assignRoleRequest:
    properties:
      role_id:
        type: string
    required:
    - role_id
    type: object
  handler.captchaConfigResponse:
    properties:
      enabled:
        type: boolean
      provider:
        type: string
      site_key:
        type: string
    type: object
  handler.changePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    required:
    - current_password
    - new_password
    type: object
  handler.createCommentRequest:
    properties:
      body:
        type: string
    required:
    - body
    type: object
  handler.createPostRequest:
    properties:
      content:
        type: string
      cover_image_url:
        type: string
      excerpt:
        type: string
      slug:
        type: string
      tag_ids:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - title
    type: object
  handler.createTagRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handler.createUserRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
    required:
    - email
    type: object
  handler.errorResponse:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  handler.forgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handler.loginRequest:
    properties:
      captcha_token:
        type: string
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handler.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.registerRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handler.resetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  handler.togglePublishRequest:
    properties:
      published:
        type: boolean
    type: object
  handler.updateCommentStatusRequest:
    properties:
      status:
        enum:
        - approved
        - rejected
        type: string
    required:
    - status
    type: object
  handler.updateMeRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      display_name:
        type: string
    type: object
  handler.updatePostRequest:
    properties:
      content:
        type: string
      cover_image_url:
        type: string
      excerpt:
        type: string
      slug:
        type: string
      tag_ids:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  handler.updateUserRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      display_name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: A production-ready personal blog REST API
  title: Simple Blog API
  version: "1.0"
paths:
  /audit-logs:
    get:
      description: Returns paginated audit logs with optional filters
      parameters:
      - description: Filter by actor ID
        in: query
        name: actor_id
        type: string
      - description: Filter by action
        in: query
        name: action
        type: string
      - description: Filter by resource type
        in: query
        name: resource_type
        type: string
      - description: Filter by resource ID
        in: query
        name: resource_id
        type: string
      - description: Start time (RFC3339)
        in: query
        name: from
        type: string
      - description: End time (RFC3339)
        in: query
        name: to
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - audit
  /audit-logs/{id}:
    get:
      description: Returns a single audit log entry by ID
      parameters:
      - description: Audit log ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuditLog'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get an audit log entry
      tags:
      - audit
  /auth/accept-invitation:
    post:
      consumes:
      - application/json
      description: Activates an invited user account using a valid invitation token
      parameters:
      - description: Invitation token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.acceptInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Accept invitation
      tags:
      - auth
  /auth/captcha-config:
    get:
      description: Returns whether captcha is enabled and the public site key for
        the frontend to render the widget
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.captchaConfigResponse'
      summary: Get captcha configuration
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset email (always returns 200 to prevent enumeration)
      parameters:
      - description: Email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.forgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Forgot password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns JWT tokens
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidates the provided refresh token
      parameters:
      - description: Refresh token to invalidate
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a refresh token for new JWT tokens
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account
      parameters:
      - description: Registration request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets a user's password using a valid reset token
      parameters:
      - description: Reset token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Reset password
      tags:
      - auth
  /comments/{id}:
    delete:
      description: Deletes a comment
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete a comment
      tags:
      - comments
  /comments/{id}/status:
    patch:
      consumes:
      - application/json
      description: Approves or rejects a comment
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      - description: Status (approved|rejected)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.updateCommentStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Update comment status
      tags:
      - comments
  /dashboard:
    get:
      description: Returns dashboard statistics and metrics
      parameters:
      - default: 30
        description: Date range in days
        in: query
        name: range
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.DashboardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get dashboard data
      tags:
      - dashboard
  /images:
    post:
      consumes:
      - multipart/form-data
      description: Uploads an image file (max 10MB)
      parameters:
      - description: Image file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Image'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Upload an image
      tags:
      - images
  /images/{id}:
    delete:
      description: Deletes an image by ID
      parameters:
      - description: Image ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete an image
      tags:
      - images
  /me:
    get:
      description: Returns the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - profile
    patch:
      consumes:
      - application/json
      description: Updates the authenticated user's profile
      parameters:
      - description: Profile data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.updateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - profile
  /me/change-password:
    post:
      consumes:
      - application/json
      description: Changes the authenticated user's password
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.changePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - profile
  /posts:
    get:
      description: Returns a paginated list of blog posts
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
